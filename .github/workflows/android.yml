name: MT CI

# Day-to-day: PRs and manual runs trigger "mtci" - runs unit tests + builds the release APK.
# Push to main only builds; unit tests already passed on the PR, so we don't repeat them after merge.
# Publishing: only via "manual trigger + publish checked" which runs the publish job,
# using the environment's signing secrets to produce the official build and create a Release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0)'
        default: '1.0'
      versionCode:
        description: 'versionCode (leave empty to use the run number)'
      publish:
        description: 'Sign the release and create a tag and GitHub Release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    # This name is a required check context for main branch protection. Do not rename.
    name: mtci
    # Skipped on manual publish (dispatch + publish): the commit already went through
    # this job before merging into main, so only the publish job is needed; avoids re-running tests + build.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
    # When the same PR gets new pushes, cancel the previous unfinished run to save time on stale builds.
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # The runner has the Android SDK preinstalled. We deliberately avoid android-actions/setup-android@v3:
      # it tries to install the legacy `tools` package, which was removed from the SDK repository,
      # and fails with exit 1. Here we only accept licenses; the missing android-37.0 is
      # downloaded automatically by AGP via android.builder.sdkDownload.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          echo "sdkmanager=$SDKMGR"
      # The Tencent mirror is unreliable for overseas runners (Connection reset); the repo keeps the mirror
      # for local use in China.
      - name: Switch Gradle distribution source to official
        run: sed -i 's|mirrors\.cloud\.tencent\.com/gradle|services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        # Skipped on pushes merged into main: already run on the PR, tree content is identical, avoids duplication.
        if: ${{ github.event_name != 'push' }}
        run: ./gradlew :app:testDebugUnitTest --console=plain
      # Generate a throwaway keystore so the release build is always signed in CI.
      # This key is random per run and is ONLY for CI verification - never for distribution
      # (users could not update the app between builds signed with different keys).
      - name: Generate temporary signing key
        run: |
          PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass "$PASS" -keypass "$PASS" \
            -alias ci-key -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MT CI, OU=CI, O=CI, C=US" > /dev/null 2>&1
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=ci-key\nkeyPassword=%s\n' \
            "$PASS" "$PASS" > keystore.properties
      - name: Build release
        run: ./gradlew :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

  publish:
    name: mtci-publish
    # Only on manual trigger with publish checked; the environment has a required reviewer, so even if
    # someone modifies the workflow, they can't get the signing secrets without your manual approval.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          echo "sdkmanager=$SDKMGR"
      - name: Switch Gradle distribution source to official
        run: sed -i 's|mirrors\.cloud\.tencent\.com/gradle|services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify version is not empty
        run: test -n "${{ inputs.version }}" || { echo "::error::publish requires a version"; exit 1; }
      - name: Restore signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Only write files, produce no output: Actions logs of public repos are visible to everyone, never echo secrets.
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build signed release
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            -Pmt.versionName="${{ inputs.version }}" \
            -Pmt.versionCode="${{ inputs.versionCode || github.run_number }}"
      # File names can't tell us whether it is signed, so verify for real with apksigner.
      - name: Verify the APK is actually signed
        run: |
          APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
          for f in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $f"
            "$APKSIGNER" verify --print-certs "$f"
          done
      - name: Create tag and Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
